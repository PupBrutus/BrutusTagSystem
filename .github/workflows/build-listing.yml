# Builds the VCC package listing from source.json and publishes it to GitHub Pages
# (https://pupbrutus.github.io/BrutusTagSystem/index.json). Uses vrchat-community/package-list-action and the
# site template in Website/ (from vrchat-community/template-package-listing, MIT).
# "Build Release" runs this after each release; run it by hand from the Actions tab to rebuild the listing only.
# Setup: Settings > Pages > Source: GitHub Actions.
name: Build Repo Listing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      # main, so a run right after a release sees the source.json it just updated
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4 # the listing builder
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false # otherwise the local repo will no longer be checked out

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build Package Version Listing
        run: ${{ env.pathToCi }}/build.cmd BuildMultiPackageListing --root ${{ env.pathToCi }} --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.listPublishDirectory }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
