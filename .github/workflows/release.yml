# Builds a GitHub release with a VCC (VPM) zip and a .unitypackage of Packages/<PACKAGE_NAME>, adds the zip to
# source.json on main, then rebuilds the VCC listing (build-listing.yml).
# From vrchat-community/template-package (MIT). Setup: Settings > Secrets and variables > Actions > Variables,
# add PACKAGE_NAME = com.pupbrutus.brutustagsystem, and Settings > Pages > Source: GitHub Actions.
# Run it on main from the Actions tab ("Build Release"); the version and tag come from the package.json "version"
# field, so bump that (and the CHANGELOG) first. Nothing is bumped automatically.
name: Build Release

on: 
  workflow_dispatch:

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required repository variable has been created for the Package, and that this runs on main
    # (the release commits source.json to main). Fails, rather than skipping the build, so a missing setup shows.
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" = "" ]; then
          echo "::error::Repository variable PACKAGE_NAME is not set (Settings > Secrets and variables > Actions > Variables)."
          exit 1
        fi
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          echo "::error::Run Build Release on main, not ${{ github.ref }}."
          exit 1
        fi
        echo "configPackage=true" >> $GITHUB_OUTPUT

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    if: needs.config.outputs.config_package == 'true'
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .
      
      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}

      # Add the release zip to source.json on main, newest first, so the listing includes it
      - name: Update source.json
        run: |
          releaseUrl="https://github.com/${{ github.repository }}/releases/download/${{ env.version }}/${{ env.zipFile }}"
          jq --arg name "${{ vars.PACKAGE_NAME }}" --arg url "${releaseUrl}"             '.packages = ((.packages // [])
              | if any(.[]?; .name == $name)
                then map(if .name == $name then .releases = ([$url] + ((.releases // []) | map(select(. != $url)))) else . end)
                else . + [{name: $name, releases: [$url]}] end)'             source.json > source.json.tmp
          mv source.json.tmp source.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          if git diff --cached --quiet; then echo "source.json already lists ${releaseUrl}"; exit 0; fi
          git commit -m "Listing: add ${{ env.version }}"
          git push origin HEAD:main

  # Rebuild and publish the VCC listing with the new release
  build-listing:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-listing.yml
